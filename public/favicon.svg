<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="outerGoldGradFav" x1="0.15" y1="0.85" x2="0.85" y2="0.15">
      <stop offset="0%" stop-color="#6F3F12" />
      <stop offset="30%" stop-color="#A56A24" />
      <stop offset="65%" stop-color="#E5BE6C" />
      <stop offset="90%" stop-color="#FFF0D0" />
      <stop offset="100%" stop-color="#E8C477" />
    </linearGradient>
    <linearGradient id="centerGoldGradFav" x1="0.2" y1="0.8" x2="0.8" y2="0.2">
      <stop offset="0%" stop-color="#734113" />
      <stop offset="50%" stop-color="#CA923E" />
      <stop offset="85%" stop-color="#FBF1D5" />
      <stop offset="100%" stop-color="#DEB766" />
    </linearGradient>
  </defs>

  <!-- Outer Metallic Gold Ring -->
  <path
    d="M 250 32
       A 218 218 0 1 1 249.9 32
       Z
       M 250 86
       A 164 164 0 1 0 250.1 86
       Z"
    fill="url(#outerGoldGradFav)"
    fill-rule="evenodd"
  />

  <!-- Clean White Disc -->
  <circle cx="250" cy="250" r="163" fill="#FFFFFF" />

  <!-- Center Metallic Iris Ring -->
  <path
    d="M 250 156
       A 94 94 0 1 1 249.9 156
       Z
       M 250 198
       A 52 52 0 1 0 250.1 198
       Z"
    fill="url(#centerGoldGradFav)"
    fill-rule="evenodd"
  />

  <!-- Center Dark Pupil Core -->
  <circle cx="250" cy="250" r="51" fill="#20120B" />
</svg>
